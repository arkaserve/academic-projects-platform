<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Prep by Arkaserve — Engineering Project Hub</title>
    <meta name="description" content="Download final year engineering projects with complete source code, step-by-step setup guides, and viva Q&A. B.Tech, M.Tech & School level projects in ML, Web Dev, IoT, Data Science, Cybersecurity, and Mobile Apps." />
    <meta name="robots" content="index, follow" />
    <meta name="keywords" content="engineering projects, final year project, B.Tech project, M.Tech project, project source code, viva questions, machine learning project, web development project, IoT project, campus placement aptitude" />
    <meta name="author" content="Prep by Arkaserve" />
    <link rel="canonical" href="https://projects.arkaserve.com/" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Prep by Arkaserve" />
    <meta property="og:url"         content="https://projects.arkaserve.com/" />
    <meta property="og:title"       content="Prep by Arkaserve — Engineering Project Hub" />
    <meta property="og:description" content="Download final year engineering projects with complete source code, step-by-step setup guides, and viva Q&A. B.Tech, M.Tech & School level projects." />
    <meta property="og:image"       content="https://projects.arkaserve.com/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale"      content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Prep by Arkaserve — Engineering Project Hub" />
    <meta name="twitter:description" content="Download final year engineering projects with complete source code, step-by-step setup guides, and viva Q&A." />
    <meta name="twitter:image"       content="https://projects.arkaserve.com/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Prep by Arkaserve",
      "url": "https://projects.arkaserve.com",
      "logo": "https://projects.arkaserve.com/og-image.png",
      "description": "Prep by Arkaserve provides hands-on final year engineering projects with complete source code, viva Q&A, and placement preparation tools for B.Tech, M.Tech, and School students.",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "url": "https://projects.arkaserve.com/contact"
      },
      "sameAs": []
    }
    </script>

    <!-- JSON-LD: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Prep by Arkaserve",
      "url": "https://projects.arkaserve.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://projects.arkaserve.com/projects?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
